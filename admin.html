<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaMarket - Painel Admin</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho Admin -->
    <header class="navbar">
        <div class="header-container">
            <a href="index.html" class="logo">Nebula<span>Admin</span></a>
            <div class="nav-actions">
                <a href="index.html" class="store-link">
                    <i class="fa-solid fa-store"></i> Voltar à Loja
                </a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal do Painel -->
    <main class="main-container">
        <section class="admin-panel">
            <div class="section-title">
                <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Novo Produto</h2>
            </div>

            <form id="productForm" class="admin-form">
                <div class="form-group">
                    <label for="pName"><i class="fa-solid fa-tag"></i> Nome do Produto</label>
                    <input type="text" id="pName" placeholder="Ex: Fone Bluetooth Pro" required>
                </div>

                <div class="form-group">
                    <label for="pPrice"><i class="fa-solid fa-dollar-sign"></i> Preço (R$)</label>
                    <input type="number" id="pPrice" step="0.01" placeholder="Ex: 99.90" required>
                </div>

                <div class="form-group">
                    <label for="pCategory"><i class="fa-solid fa-list"></i> Categoria</label>
                    <select id="pCategory" required>
                        <option value="Eletrônicos">Eletrônicos</option>
                        <option value="Roupas & Acessórios">Roupas & Acessórios</option>
                        <option value="Casa & Decoração">Casa & Decoração</option>
                        <option value="Esportes">Esportes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pImage"><i class="fa-solid fa-image"></i> URL da Imagem</label>
                    <input type="url" id="pImage" placeholder="https://link-da-imagem.com/foto.jpg" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Produto
                </button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 NebulaMarket. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
