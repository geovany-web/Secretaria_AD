```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chamada - Assembleia de Deus</title>

    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

    <header>
        <div class="logo">⛪</div>

        <div>
            <h1>Assembleia de Deus</h1>
            <p>Sistema de Chamada</p>
        </div>
    </header>


    <main>

        <section class="inicio">

            <h2>Lista de Presença</h2>

            <label for="data">Data da chamada:</label>

            <input type="date" id="data">

        </section>


        <!-- HOMENS -->
        <section class="grupo">

            <div class="titulo-grupo">
                <h2>👨 Homens</h2>

                <button onclick="adicionarPessoa('homens')">
                    + Adicionar
                </button>
            </div>

            <div id="homens" class="lista"></div>

        </section>


        <!-- MULHERES -->
        <section class="grupo">

            <div class="titulo-grupo">
                <h2>👩 Mulheres</h2>

                <button onclick="adicionarPessoa('mulheres')">
                    + Adicionar
                </button>
            </div>

            <div id="mulheres" class="lista"></div>

        </section>


        <!-- JOVENS -->
        <section class="grupo">

            <div class="titulo-grupo">
                <h2>🧑 Jovens</h2>

                <button onclick="adicionarPessoa('jovens')">
                    + Adicionar
                </button>
            </div>

            <div id="jovens" class="lista"></div>

        </section>


        <!-- ADOLESCENTES -->
        <section class="grupo">

            <div class="titulo-grupo">
                <h2>🧒 Adolescentes</h2>

                <button onclick="adicionarPessoa('adolescentes')">
                    + Adicionar
                </button>
            </div>

            <div id="adolescentes" class="lista"></div>

        </section>


        <!-- CRIANÇAS -->
        <section class="grupo">

            <div class="titulo-grupo">
                <h2>👦 Crianças</h2>

                <button onclick="adicionarPessoa('criancas')">
                    + Adicionar
                </button>
            </div>

            <div id="criancas" class="lista"></div>

        </section>


        <!-- BERÇÁRIO -->
        <section class="grupo">

            <div class="titulo-grupo">
                <h2>👶 Berçário</h2>

                <button onclick="adicionarPessoa('bercario')">
                    + Adicionar
                </button>
            </div>

            <div id="bercario" class="lista"></div>

        </section>


        <!-- RESUMO -->
        <section class="resumo">

            <h2>Resumo da chamada</h2>

            <div class="resumo-caixas">

                <div>
                    <strong id="totalPessoas">0</strong>
                    <span>Total</span>
                </div>

                <div class="presente">
                    <strong id="totalPresentes">0</strong>
                    <span>Presentes</span>
                </div>

                <div class="falta">
                    <strong id="totalFaltas">0</strong>
                    <span>Faltas</span>
                </div>

            </div>

        </section>


        <!-- BOTÕES -->
        <section class="acoes">

            <button class="botao-pdf" onclick="baixarPDF()">
                📄 Baixar chamada em PDF
            </button>

            <button class="botao-limpar" onclick="novaChamada()">
                🔄 Nova chamada
            </button>

        </section>

    </main>


    <footer>

        <p>
            Assembleia de Deus
        </p>

        <span>
            Sistema de Chamada
        </span>

    </footer>


    <script src="script.js"></script>

</body>

</html>
```
